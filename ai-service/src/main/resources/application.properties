spring.application.name=ai-service
server.port=8086
server.shutdown=graceful

management.endpoints.web.exposure.include=*
management.info.git.mode=full

# ai-db (pgvector)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:65432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Ollama (local LLM ? no OpenAI key)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.embedding.options.model=nomic-embed-text

# pgvector store (dims must match nomic-embed-text = 768)
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.id-type=TEXT
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768


# Catalog source for ingest
catalog.service-url=${CATALOG_SERVICE_URL:http://localhost:8081}
catalog.ingest.page-size=${CATALOG_INGEST_PAGE_SIZE:100}


